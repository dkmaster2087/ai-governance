# Deploys to AWS. Started by hand only (Actions → Deploy → Run workflow); a push never deploys.
# Needs the repository secrets AWS_DEPLOY_ROLE_ARN, AWS_ACCOUNT_ID, WEBSITE_BUCKET_NAME and
# CLOUDFRONT_DISTRIBUTION_ID, and a GitHub environment per stage (add required reviewers to prod).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
      destroy:
        description: 'Destroy environment (teardown)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  AWS_REGION: us-east-1

defaults:
  run:
    working-directory: ai-governance-platform

jobs:
  # ─── Build & Push Docker Images ───────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: ${{ !inputs.destroy }}
    strategy:
      matrix:
        service: [gateway, policy-engine, data-protection, analytics]
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          STAGE: ${{ inputs.stage }}
        run: |
          REPO="$ECR_REGISTRY/ai-gov-${{ matrix.service }}-$STAGE"
          # The Dockerfiles build from the ai-governance-platform folder (npm workspaces)
          docker build -f "services/${{ matrix.service }}/Dockerfile" -t "$REPO:${{ github.sha }}" .
          docker push "$REPO:${{ github.sha }}"
          docker tag "$REPO:${{ github.sha }}" "$REPO:latest"
          docker push "$REPO:latest"

  # ─── CDK Deploy ───────────────────────────────────────────────────────────
  cdk-deploy:
    name: CDK Deploy — ${{ inputs.stage }}
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ !inputs.destroy }}
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai-governance-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages and infra
        run: npm run build -w shared/types -w shared/utils -w infra

      - name: CDK Bootstrap (idempotent)
        run: npx cdk bootstrap
        working-directory: ai-governance-platform/infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: CDK Deploy all stacks
        run: npx cdk deploy --all --require-approval never --context stage=${{ inputs.stage }}
        working-directory: ai-governance-platform/infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

  # ─── Deploy Website to S3/CloudFront ──────────────────────────────────────
  deploy-website:
    name: Deploy Website
    runs-on: ubuntu-latest
    needs: cdk-deploy
    if: ${{ !inputs.destroy }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai-governance-platform/package-lock.json

      - name: Install & build website
        run: |
          npm ci
          npm run build -w frontend/website

      - name: Sync to S3
        run: |
          aws s3 sync frontend/website/dist/ s3://${{ secrets.WEBSITE_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp frontend/website/dist/index.html s3://${{ secrets.WEBSITE_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # ─── Teardown (destroy all stacks) ────────────────────────────────────────
  cdk-destroy:
    name: CDK Destroy — ${{ inputs.stage }}
    runs-on: ubuntu-latest
    if: ${{ inputs.destroy == true }}
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai-governance-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages and infra
        run: npm run build -w shared/types -w shared/utils -w infra

      - name: CDK Destroy all stacks
        run: npx cdk destroy --all --force --context stage=${{ inputs.stage }}
        working-directory: ai-governance-platform/infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
