# Tests and builds on every push and pull request. Never deploys and needs no cloud credentials;
# deploying is a separate, manually started workflow (deploy.yml).
name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

defaults:
  run:
    working-directory: ai-governance-platform

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A real PostgreSQL for the storage contract tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: probaline
          POSTGRES_PASSWORD: probaline-ci
          POSTGRES_DB: probaline
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U probaline" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai-governance-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build -w shared/types -w shared/utils -w shared/storage

      - name: Storage (memory and PostgreSQL)
        working-directory: ai-governance-platform/shared/storage
        run: npx jest --runInBand --ci
        env:
          PG_TEST_URL: postgres://probaline:probaline-ci@localhost:5432/probaline

      - name: Shared utils
        working-directory: ai-governance-platform/shared/utils
        run: npx jest --ci

      - name: Gateway
        working-directory: ai-governance-platform/services/gateway
        run: npx jest --runInBand --ci

      - name: Policy engine
        working-directory: ai-governance-platform/services/policy-engine
        run: npx jest --runInBand --ci

      - name: Data protection
        working-directory: ai-governance-platform/services/data-protection
        run: npx jest --runInBand --ci

      - name: Analytics
        working-directory: ai-governance-platform/services/analytics
        run: npx jest --runInBand --ci

      - name: Reporting agent
        working-directory: ai-governance-platform/services/reporting-agent
        run: npx jest --runInBand --ci

      - name: Infrastructure
        working-directory: ai-governance-platform/infra
        run: npx jest --ci

      - name: Collector
        working-directory: ai-governance-platform/collector
        run: npx jest --runInBand --ci

      - name: Connector
        working-directory: ai-governance-platform/connector
        run: npx jest --runInBand --ci

      - name: Browser extension
        run: node --test extensions/shadow-ai-guard/tests/lib.test.mjs

      - name: Dashboard
        working-directory: ai-governance-platform/frontend/dashboard
        run: npx vitest run

      - name: Website
        working-directory: ai-governance-platform/frontend/website
        run: npx vitest run

      - name: Docs site
        working-directory: ai-governance-platform/frontend/docs
        run: npx vitest run

  # The whole request path through the real services (mutual TLS, signed internal calls), against LocalStack,
  # on each storage backend: tests/e2e/*.test.mjs.
  e2e:
    name: End to end — ${{ matrix.storage }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        storage: [dynamodb, postgres]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai-governance-platform/package-lock.json
      - name: Install dependencies
        run: |
          command -v lsof > /dev/null || sudo apt-get install -y lsof
          npm ci
      - name: Start the services
        env: { SITES: 'off' }
        run: ./scripts/dev-local.sh start ${{ matrix.storage == 'postgres' && '--postgres' || '' }}
      - name: Wait for the gateway
        run: |
          for i in $(seq 1 90); do curl -sf localhost:3000/health > /dev/null && exit 0; sleep 2; done
          echo "The gateway didn't start"; tail -50 .dev-logs/gateway.log; exit 1
      - name: End-to-end suite
        run: npm run test:e2e
      - name: Service logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: 'e2e-logs-${{ matrix.storage }}', path: ai-governance-platform/.dev-logs/, retention-days: 7 }
      - name: Stop
        if: always()
        run: ./scripts/dev-local.sh stop

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai-governance-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build -w shared/types -w shared/utils -w shared/storage

      - name: Build services and collector
        run: npm run build -w services/gateway -w services/policy-engine -w services/data-protection -w services/analytics -w services/reporting-agent -w collector -w connector

      - name: Build frontends
        run: npm run build -w frontend/dashboard -w frontend/website -w frontend/docs

      # No account set, so CDK makes no AWS lookups and needs no credentials.
      - name: Synthesize infrastructure
        working-directory: ai-governance-platform/infra
        run: npx cdk synth --context stage=dev -q
        env:
          CDK_DEFAULT_REGION: us-east-1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Known high or critical vulnerabilities in shipped packages fail the build, unless recorded in
      # security/accepted-risks.json with a reason and a review date (SECURITY.md).
      - name: Check shipped packages for known vulnerabilities
        run: node scripts/audit-check.mjs

  images:
    name: Image · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, dockerfile: services/Dockerfile, context: ., kind: service, args: '--build-arg SERVICE=gateway --build-arg PORT=3000' }
          - { name: policy-engine, dockerfile: services/Dockerfile, context: ., kind: service, args: '--build-arg SERVICE=policy-engine --build-arg PORT=3001' }
          - { name: data-protection, dockerfile: services/Dockerfile, context: ., kind: service, args: '--build-arg SERVICE=data-protection --build-arg PORT=3002' }
          - { name: analytics, dockerfile: services/Dockerfile, context: ., kind: service, args: '--build-arg SERVICE=analytics --build-arg PORT=3003' }
          - { name: reporting-agent, dockerfile: services/Dockerfile, context: ., kind: service, args: '--build-arg SERVICE=reporting-agent --build-arg PORT=3005' }
          - { name: collector, dockerfile: collector/Dockerfile, context: ., kind: agent }
          - { name: connector, dockerfile: connector/Dockerfile, context: ., kind: agent }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Build only, to prove each Dockerfile works; pushing happens in deploy.yml (services) and release-agents.yml.
      - name: Build image
        run: docker build -f ${{ matrix.dockerfile }} ${{ matrix.args }} -t probaline-${{ matrix.name }}:ci ${{ matrix.context }}
      # Service, connector and collector images must ship bytecode only: no source, no shell, no npm.
      - name: Check nothing readable ships
        run: |
          id=$(docker create probaline-${{ matrix.name }}:ci)
          docker export "$id" > image.tar
          files=$(tar -tf image.tar)
          echo "$files" | grep -q '^app/app.jsc$'
          ! echo "$files" | grep -E '^app/.*\.(ts|map)$|^app/app\.js$|^app/node_modules/|^bin/(sh|bash)$|^usr/bin/npm'
          docker rm "$id" > /dev/null
      # Known high or critical vulnerabilities with a fix available, in the base image or the packages inside.
      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: probaline-${{ matrix.name }}:ci
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
