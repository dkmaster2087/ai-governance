# Dependabot opens pull requests for known-vulnerable dependencies as soon as an advisory is published
# (security updates, turned on in the repository's settings), and for routine updates weekly. CI checks each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /ai-governance-platform
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Patch and minor updates arrive as one pull request; major versions stay separate, they need review.
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # The base images the services, connector and collector are built on.
  - package-ecosystem: docker
    directories:
      - /ai-governance-platform/services
      - /ai-governance-platform/collector
      - /ai-governance-platform/connector
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]

  # GitHub Actions are pinned to commits; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]
