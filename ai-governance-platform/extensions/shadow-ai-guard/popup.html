<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Probaline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <header>
    <strong class="brand"><img src="icons/icon48.png" width="20" height="20" alt="">Probaline</strong>
    <span id="mode" class="pill"></span>
  </header>
  <p id="summary" class="lead"></p>

  <section id="approved" hidden>
    <h2>Approved AI tools</h2>
    <ul id="links"></ul>
  </section>

  <dl id="facts"></dl>

  <section id="setup" hidden>
    <h2>Test setup</h2>
    <p class="fine">Companies set these through Chrome policy. Use this only to try the extension.</p>
    <label>Gateway address <input id="gatewayUrl" type="url" placeholder="https://gateway.example.com"></label>
    <label>API key (shadow_ai:ingest) <input id="apiKey" type="password" autocomplete="off" placeholder="pbl_…"></label>
    <button id="save" type="button">Save</button>
  </section>
  <button id="sync" type="button" class="secondary">Check for new settings</button>
  <script src="popup.js" type="module"></script>
</body>
</html>
