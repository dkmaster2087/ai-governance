version: '3.9'

services:
  # ── LocalStack (mocks AWS: DynamoDB, S3, Comprehend) ──────────────────────
  localstack:
    image: localstack/localstack:3.4
    container_name: ai-gov-localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=s3,dynamodb,comprehend,athena,secretsmanager,kms
      - DEFAULT_REGION=us-east-1
      - EAGER_SERVICE_LOADING=1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack-data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 10

  # ── PostgreSQL (STORAGE_BACKEND=postgres; scripts/dev-local.sh start --postgres) ──
  postgres:
    image: postgres:16-alpine
    container_name: probaline-postgres
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=probaline
      - POSTGRES_PASSWORD=probaline-dev
      - POSTGRES_DB=probaline
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'probaline']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Probaline: the one image, in the "all" role (gateway with every check, plus reports on 127.0.0.1) ──
  probaline:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: probaline
    ports:
      - '3000:3000'
    env_file: .env.local
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - COMPREHEND_ENABLED=false
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  localstack-data:
  postgres-data:
