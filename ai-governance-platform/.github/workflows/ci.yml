name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  AWS_REGION: us-east-1

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ai-governance-platform/package-lock.json

      - name: Install dependencies
        working-directory: ai-governance-platform
        run: npm ci

      # Gateway tests
      - name: Test Gateway
        working-directory: ai-governance-platform/services/gateway
        run: npx jest --runInBand --ci --coverage

      # Policy Engine tests
      - name: Test Policy Engine
        working-directory: ai-governance-platform/services/policy-engine
        run: npx jest --runInBand --ci --coverage

      # Reporting Agent tests
      - name: Test Reporting Agent
        working-directory: ai-governance-platform/services/reporting-agent
        run: npx jest --runInBand --ci

      # Frontend Dashboard tests
      - name: Test Dashboard
        working-directory: ai-governance-platform/frontend/dashboard
        run: npx vitest --run

      # Frontend Website tests
      - name: Test Website
        working-directory: ai-governance-platform/frontend/website
        run: npx vitest --run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ai-governance-platform/package-lock.json

      - name: Install dependencies
        working-directory: ai-governance-platform
        run: npm ci

      # Build frontend
      - name: Build Dashboard
        working-directory: ai-governance-platform/frontend/dashboard
        run: npx vite build

      - name: Build Website
        working-directory: ai-governance-platform/frontend/website
        run: npx vite build

      # Build backend services (TypeScript compile check)
      - name: Build Gateway
        working-directory: ai-governance-platform/services/gateway
        run: npx tsc --noEmit

      - name: Build Policy Engine
        working-directory: ai-governance-platform/services/policy-engine
        run: npx tsc --noEmit

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [gateway, policy-engine, analytics, data-protection, reporting-agent]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        working-directory: ai-governance-platform/services/${{ matrix.service }}
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/ai-gov-${{ matrix.service }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          docker tag $IMAGE ${{ steps.ecr.outputs.registry }}/ai-gov-${{ matrix.service }}:latest
          docker push ${{ steps.ecr.outputs.registry }}/ai-gov-${{ matrix.service }}:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Deploy infrastructure
        working-directory: ai-governance-platform/infra
        run: |
          npm ci
          cdk deploy --all --require-approval never -c stage=staging
