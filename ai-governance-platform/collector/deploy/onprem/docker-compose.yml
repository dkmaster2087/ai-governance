# Example: run the on-premises collector on any Linux host with Docker.
# Point firewalls and proxies at this host's port 514 (UDP or TCP), and/or mount log folders under /logs.
services:
  probaline-collector:
    image: probaline/collector:0.1.0
    restart: unless-stopped
    ports:
      - "514:5514/udp"
      - "514:5514/tcp"
    environment:
      COMPANY: "Acme"
      WATCH_DIR: /logs
      # The Probaline gateway and connector, comma separated, e.g. ip:10.0.0.10: counted as through Probaline
      GATEWAY: ""
      # Other known-good callers to leave out entirely, comma separated
      IGNORE: ""
    volumes:
      - probaline-data:/data
      # Read-only: DNS server and proxy log folders to follow.
      - /var/log/named:/logs/bind:ro
      - /var/log/squid:/logs/squid:ro
volumes:
  probaline-data:
