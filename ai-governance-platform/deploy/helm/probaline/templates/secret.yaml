{{- if and (not .Values.existingSecret) .Values.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "probaline.secretName" . }}
  labels: {{- include "probaline.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
