apiVersion: v1
kind: Service
metadata:
  name: {{ include "probaline.name" . }}
  labels: {{- include "probaline.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "probaline.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
