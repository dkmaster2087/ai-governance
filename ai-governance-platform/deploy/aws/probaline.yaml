AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Probaline in your own AWS account: the gateway (with its dashboard and reports) on ECS Fargate behind an HTTPS
  load balancer, with PostgreSQL in RDS. Nothing is sent to Probaline. Guide: docs/INSTALL.md.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Probaline }
        Parameters: [ImageUri, GatewayAddress, CertificateArn, CompanyName, AdminEmail, LicenseFile]
      - Label: { default: Network (an existing VPC) }
        Parameters: [VpcId, LoadBalancerSubnetIds, ServiceSubnetIds, LoadBalancerScheme, AllowedCidr]
      - Label: { default: Size }
        Parameters: [DesiredCount, TaskCpu, TaskMemory, DatabaseInstanceClass, DatabaseMultiAz, DatabaseStorageGb]

Parameters:
  ImageUri:
    Type: String
    Description: The Probaline image, e.g. <account>.dkr.ecr.<region>.amazonaws.com/probaline:1.0.0 (copied into your ECR).
  GatewayAddress:
    Type: String
    AllowedPattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'
    Description: The gateway's hostname, as in the license (e.g. ai-gateway.customer.com). Point it at the load balancer.
  CertificateArn:
    Type: String
    Description: An ACM certificate for GatewayAddress, in this region.
  CompanyName:
    Type: String
    Default: My company
  AdminEmail:
    Type: String
    Description: The first admin. Their temporary password is written once to the gateway's log (CloudWatch).
  LicenseFile:
    Type: String
    NoEcho: true
    Default: ''
    Description: The license file's text (PBL1.…). Optional; it can be entered on the License page (30 days without one).
  VpcId:
    Type: AWS::EC2::VPC::Id
  LoadBalancerSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more subnets in different zones for the load balancer (public for internet-facing, private for internal).
  ServiceSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more private subnets with a route to the internet (NAT) for the gateway and the database. The gateway reaches AI providers from here.
  LoadBalancerScheme:
    Type: String
    AllowedValues: [internal, internet-facing]
    Default: internal
    Description: internal keeps the gateway on your network (apps and people reach it by VPN or peering).
  AllowedCidr:
    Type: String
    Default: 10.0.0.0/8
    Description: Who may reach the load balancer on 443.
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
  TaskCpu:
    Type: String
    AllowedValues: ['512', '1024', '2048', '4096']
    Default: '1024'
  TaskMemory:
    Type: String
    AllowedValues: ['1024', '2048', '4096', '8192']
    Default: '2048'
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.small
  DatabaseMultiAz:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  DatabaseStorageGb:
    Type: Number
    Default: 50
    MinValue: 20

Conditions:
  HasLicense: !Not [!Equals [!Ref LicenseFile, '']]

Resources:
  # ── Secrets ────────────────────────────────────────────────────────────────────────────────────────────────
  # Encrypts provider keys and other secrets in the database. 43 random letters and digits decode (base64) to
  # 32 bytes. Kept when the stack is deleted: without it, saved provider keys can't be read.
  EncryptionKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Probaline SECRETS_ENCRYPTION_KEY
      GenerateSecretString: { PasswordLength: 43, ExcludePunctuation: true }
  License:
    Type: AWS::SecretsManager::Secret
    Condition: HasLicense
    Properties:
      Description: Probaline license file
      SecretString: !Ref LicenseFile

  # ── Database ───────────────────────────────────────────────────────────────────────────────────────────────
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Probaline database, from the gateway only
      VpcId: !Ref VpcId
  DatabaseFromGateway:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ServiceSecurityGroup
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Probaline database
      SubnetIds: !Ref ServiceSubnetIds
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '16'
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseStorageGb
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !Ref DatabaseMultiAz
      DBName: probaline
      MasterUsername: probaline
      # RDS makes the password and keeps it in Secrets Manager; the gateway reads it from there.
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 14
      DeletionProtection: true
      CopyTagsToSnapshot: true

  # ── Load balancer ──────────────────────────────────────────────────────────────────────────────────────────
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Probaline load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedCidr }
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: !Ref LoadBalancerScheme
      Subnets: !Ref LoadBalancerSubnetIds
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: idle_timeout.timeout_seconds, Value: '120' }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /health/ready
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  # ── The gateway ────────────────────────────────────────────────────────────────────────────────────────────
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Probaline gateway, from its load balancer only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup }
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 90
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-settings
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref EncryptionKey
                  - !If [HasLicense, !Ref License, !Ref AWS::NoValue]
  # The gateway's own permissions: none beyond what its settings say. Add Bedrock here to use Bedrock models.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ContainerDefinitions:
        - Name: probaline
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          PortMappings: [{ ContainerPort: 3000 }]
          MountPoints: [{ SourceVolume: tmp, ContainerPath: /tmp }]
          Environment:
            - { Name: PROBALINE_ROLE, Value: all }
            - { Name: LICENSING, Value: offline }
            - { Name: STORAGE_BACKEND, Value: postgres }
            - { Name: SECRET_STORE, Value: database }
            - { Name: OBJECT_STORE, Value: none }
            - { Name: PUBLIC_GATEWAY_URL, Value: !Sub 'https://${GatewayAddress}' }
            - { Name: PROBALINE_COMPANY_NAME, Value: !Ref CompanyName }
            - { Name: PROBALINE_ADMIN_EMAIL, Value: !Ref AdminEmail }
            - { Name: TRUSTED_PROXY_HOPS, Value: '1' }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: PGHOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: PGPORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: PGDATABASE, Value: probaline }
            - { Name: PGSSLMODE, Value: verify-full }
            - { Name: NODE_EXTRA_CA_CERTS, Value: /app/certs/rds-global-bundle.pem }
          Secrets:
            - { Name: PGUSER, ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:username::' }
            - { Name: PGPASSWORD, ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::' }
            - { Name: SECRETS_ENCRYPTION_KEY, ValueFrom: !Ref EncryptionKey }
            - !If [HasLicense, { Name: PROBALINE_LICENSE, ValueFrom: !Ref License }, !Ref AWS::NoValue]
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: probaline }
          HealthCheck:
            Command: ['CMD', '/nodejs/bin/node', '-e', "require('http').get({host:'localhost',port:3000,path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
      Volumes: [{ Name: tmp }]
  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: false
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref ServiceSubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers: [{ ContainerName: probaline, ContainerPort: 3000, TargetGroupArn: !Ref TargetGroup }]

Outputs:
  LoadBalancerDns:
    Description: Point GatewayAddress (a CNAME or alias record) at this.
    Value: !GetAtt LoadBalancer.DNSName
  DashboardUrl:
    Value: !Sub 'https://${GatewayAddress}'
  FirstAdminPassword:
    Description: Where the first admin's temporary password is (search for "first admin").
    Value: !Sub 'CloudWatch Logs, group ${Logs}'
